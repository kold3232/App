<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RockServ</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #F1F5F9;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 24px;
  }
  .card {
    background: #FFFFFF;
    border-radius: 24px;
    padding: 40px 32px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(15, 30, 70, 0.12);
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    color: #0F1E46;
    margin: 0 0 8px;
  }
  p {
    font-size: 14.5px;
    line-height: 1.5;
    color: #52607A;
    margin: 0 0 24px;
  }
  a {
    display: block;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1.5px solid #E2E8F0;
    color: #0F1E46;
    font-size: 14.5px;
    font-weight: 700;
    text-decoration: none;
    margin-bottom: 10px;
  }
  a:hover { border-color: #0F1E46; }
  .footer {
    font-size: 12px;
    color: #94A3B8;
    margin: 20px 0 0;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>RockServ</h1>
    <p>Trusted local tradespeople in Gibraltar.</p>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms of Service</a>
    <p class="footer">Questions? support@rockserv.gi</p>
  </div>
</body>
</html>
