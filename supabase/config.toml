# commission-paid / commission-cancelled are plain browser redirect targets
# from Stripe Checkout — no Authorization header is attached, so JWT
# verification (Supabase's default for Edge Functions) must be off or every
# visit 401s before the page ever renders. The other functions keep the
# default (JWT required) since the app always calls them with a session.
[functions.commission-paid]
verify_jwt = false

[functions.commission-cancelled]
verify_jwt = false
